<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-label="Animated illustration of a window being cleaned with a squeegee">
<defs>
  <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF4FF"/><stop offset="1" stop-color="#BBDBFF"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46ABFF"/><stop offset=".55" stop-color="#92D0FF"/><stop offset="1" stop-color="#D8EEFF"/></linearGradient>
  <linearGradient id="film" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="bub" cx=".3" cy=".28" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".18" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#6EB4FF" stop-opacity=".18"/><stop offset="1" stop-color="#3C96FF" stop-opacity=".5"/></radialGradient>
  <clipPath id="panes"><rect x="136" y="124" width="138" height="140" rx="6"/><rect x="286" y="124" width="138" height="140" rx="6"/><rect x="136" y="276" width="138" height="140" rx="6"/><rect x="286" y="276" width="138" height="140" rx="6"/></clipPath>
  <mask id="wipe" maskUnits="userSpaceOnUse" x="0" y="0" width="560" height="560">
    <rect width="560" height="560" fill="#fff"/>
    <rect class="wipe" x="130" y="118" width="300" height="292" fill="#000"/>
  </mask>
  <path id="star" d="M0-16C2-5 5-2 16 0 5 2 2 5 0 16-2 5-5 2-16 0-5-2-2-5 0-16Z"/>
</defs>
<style>
  .fl{animation:floaty 6s ease-in-out infinite}
  .wipe{transform-box:fill-box;transform-origin:50% 0%;animation:wipe 8s ease-in-out infinite}
  .grime{animation:grime 8s linear infinite}
  .sq{animation:sq 8s ease-in-out infinite}
  .drip{animation:drip 1s ease-in infinite}
  .shine{animation:shine 8s ease-in-out infinite}
  .glints{animation:glints 8s ease-in-out infinite}
  .tw{transform-box:fill-box;transform-origin:center;animation:tw 1.6s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  @keyframes wipe{0%{transform:scaleY(0)}55%{transform:scaleY(1)}94%{transform:scaleY(1)}95%,100%{transform:scaleY(0)}}
  @keyframes grime{0%,92%{opacity:1}94%,95%{opacity:0}100%{opacity:1}}
  @keyframes sq{0%{transform:translateY(0);opacity:1}55%{transform:translateY(292px);opacity:1}60%,94%{transform:translateY(292px);opacity:0}95%{transform:translateY(0);opacity:0}100%{transform:translateY(0);opacity:1}}
  @keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(30px);opacity:0}}
  @keyframes shine{0%,58%{transform:translateX(-360px)}82%,100%{transform:translateX(360px)}}
  @keyframes glints{0%,56%{opacity:0}62%,84%{opacity:1}92%,100%{opacity:0}}
  @keyframes tw{0%,100%{transform:scale(.4) rotate(0)}50%{transform:scale(1) rotate(45deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<circle cx="280" cy="290" r="252" fill="url(#blob)"/>

<!-- window -->
<rect x="104" y="448" width="352" height="18" rx="9" fill="#0A2766" opacity=".12"/>
<rect x="112" y="100" width="336" height="340" rx="22" fill="#fff" stroke="#0A2766" stroke-width="6"/>
<rect x="124" y="112" width="312" height="316" rx="14" fill="#EAF4FF" stroke="#0A2766" stroke-width="3"/>
<rect x="136" y="124" width="138" height="140" rx="6" fill="url(#glass)"/><rect x="286" y="124" width="138" height="140" rx="6" fill="url(#glass)"/><rect x="136" y="276" width="138" height="140" rx="6" fill="url(#glass)"/><rect x="286" y="276" width="138" height="140" rx="6" fill="url(#glass)"/>
<g clip-path="url(#panes)">
  <g fill="#fff" opacity=".6">
    <ellipse cx="190" cy="168" rx="38" ry="12"/><ellipse cx="212" cy="158" rx="24" ry="12"/>
    <ellipse cx="368" cy="226" rx="34" ry="10"/><ellipse cx="386" cy="217" rx="20" ry="10"/>
    <ellipse cx="204" cy="352" rx="40" ry="12"/><ellipse cx="226" cy="342" rx="22" ry="11"/>
  </g>
  <g class="shine"><polygon points="190,110 250,110 160,430 100,430" fill="#fff" opacity=".5"/><polygon points="262,110 280,110 190,430 172,430" fill="#fff" opacity=".4"/></g>
</g>
<!-- grime (wiped away by the squeegee) -->
<g clip-path="url(#panes)" mask="url(#wipe)"><g class="grime">
  <rect x="130" y="118" width="300" height="304" fill="#8F9C84" opacity=".66"/>
  <g fill="#6E7D63" opacity=".5"><ellipse cx="190" cy="170" rx="46" ry="20"/><ellipse cx="350" cy="214" rx="54" ry="22"/><ellipse cx="220" cy="340" rx="60" ry="24"/><ellipse cx="380" cy="372" rx="40" ry="18"/></g>
  <g stroke="#59674F" stroke-width="3" stroke-linecap="round" opacity=".3"><path d="M160 150v40M232 140v60M326 140v50M398 150v36M168 296v52M250 300v36M338 292v70M404 300v44"/></g>
</g></g>
<rect x="136" y="124" width="138" height="140" rx="6" fill="none" stroke="#0A2766" stroke-width="3.5"/><rect x="286" y="124" width="138" height="140" rx="6" fill="none" stroke="#0A2766" stroke-width="3.5"/><rect x="136" y="276" width="138" height="140" rx="6" fill="none" stroke="#0A2766" stroke-width="3.5"/><rect x="286" y="276" width="138" height="140" rx="6" fill="none" stroke="#0A2766" stroke-width="3.5"/>
<!-- glints on clean glass -->
<g class="glints">
  <use href="#star" class="tw" x="186" y="172" fill="#fff" stroke="#0A2766" stroke-width="1.4"/>
  <use href="#star" class="tw" x="374" y="332" fill="#FFE27A" stroke="#0A2766" stroke-width="1.4" style="animation-delay:-.8s"/>
</g>
<!-- sill -->
<rect x="94" y="428" width="372" height="30" rx="12" fill="#FFC81A" stroke="#0A2766" stroke-width="5"/>
<rect x="110" y="436" width="130" height="6" rx="3" fill="#fff" opacity=".6"/>

<!-- squeegee -->
<g transform="translate(0 124)"><g class="sq">
  <rect x="136" y="2" width="288" height="26" fill="url(#film)"/>
  <line x1="352" y1="0" x2="474" y2="-70" stroke="#0A2766" stroke-width="17" stroke-linecap="round"/>
  <line x1="352" y1="0" x2="474" y2="-70" stroke="#FFC81A" stroke-width="9" stroke-linecap="round"/>
  <line x1="436" y1="-48" x2="474" y2="-70" stroke="#0768D9" stroke-width="9" stroke-linecap="round"/>
  <rect x="126" y="-8" width="308" height="18" rx="9" fill="#DCE8F8" stroke="#0A2766" stroke-width="4"/>
  <rect x="136" y="10" width="288" height="7" rx="3.5" fill="#0A2766"/>
  <g fill="#2BA3FF" stroke="#0A2766" stroke-width="1.6">
    <path class="drip" d="M190 20C185 28 185 34 190 34 195 34 195 28 190 20Z"/>
    <path class="drip" style="animation-delay:-.35s" d="M268 20C263 28 263 34 268 34 273 34 273 28 268 20Z"/>
    <path class="drip" style="animation-delay:-.7s" d="M356 20C351 28 351 34 356 34 361 34 361 28 356 20Z"/>
  </g>
</g></g>

<!-- a few bubbles, nothing more -->
<g class="fl" style="animation-delay:0s;animation-duration:6.5s"><circle cx="66" cy="206" r="16" fill="url(#bub)" stroke="#fff" stroke-width="1.6"/><ellipse cx="60.4" cy="199.6" rx="4.5" ry="2.6" fill="#fff" opacity=".95" transform="rotate(-35 60.4 199.6)"/></g><g class="fl" style="animation-delay:-1.5s;animation-duration:7s"><circle cx="498" cy="330" r="20" fill="url(#bub)" stroke="#fff" stroke-width="1.6"/><ellipse cx="491.0" cy="322.0" rx="5.6" ry="3.2" fill="#fff" opacity=".95" transform="rotate(-35 491.0 322.0)"/></g><g class="fl" style="animation-delay:-3s;animation-duration:5.8s"><circle cx="92" cy="424" r="10" fill="url(#bub)" stroke="#fff" stroke-width="1.6"/><ellipse cx="88.5" cy="420.0" rx="2.8" ry="1.6" fill="#fff" opacity=".95" transform="rotate(-35 88.5 420.0)"/></g><g class="fl" style="animation-delay:-2s;animation-duration:6.2s"><circle cx="486" cy="150" r="12" fill="url(#bub)" stroke="#fff" stroke-width="1.6"/><ellipse cx="481.8" cy="145.2" rx="3.4" ry="1.9" fill="#fff" opacity=".95" transform="rotate(-35 481.8 145.2)"/></g><g class="fl" style="animation-delay:-4s;animation-duration:5.5s"><circle cx="300" cy="52" r="11" fill="url(#bub)" stroke="#fff" stroke-width="1.6"/><ellipse cx="296.1" cy="47.6" rx="3.1" ry="1.8" fill="#fff" opacity=".95" transform="rotate(-35 296.1 47.6)"/></g>
<use href="#star" class="tw" x="60" y="120" fill="#FFC81A" stroke="#0A2766" stroke-width="2"/>
<use href="#star" class="tw" x="506" y="456" fill="#fff" stroke="#0A2766" stroke-width="2" style="animation-delay:-1.1s"/>
</svg>